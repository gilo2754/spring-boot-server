# =============================================
# Versión de la aplicación
# =============================================
com.pluralsight.fundamentals.version=@version@
spring.profiles.active=@SPRING_PROFILE@

# =============================================
# Configuración del servidor
# =============================================
server.port=8081
server.connection-timeout=10000
server.error.include-message=always

# =============================================
# Configuración de la base de datos H2
# =============================================
spring.datasource.platform=h2
spring.datasource.url=jdbc:h2:mem:test
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=
spring.datasource.initialization-mode=embedded

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.h2.console.settings.trace=true
spring.h2.console.settings.web-allow-others=true

# =============================================
# Configuración de logging
# =============================================
logging.level.org.springframework=DEBUG

# =============================================
# Configuración de Spring Security y JWT
# =============================================
jwt.secretKey=JWT-SECRET
jwt.expiration=86400000

# =============================================
# Configuración de correo electrónico
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gilo.dev@gmail.com
spring.mail.password=${MAIL_FROM_PASSWORT}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Configuración de Google OAuth2
# =============================================
google.client.client-id=<DEINE_CLIENT_ID>
google.client.client-secret=<DEIN_CLIENT_SECRET>
google.client.redirect-uri=<DEIN_REDIRECT_URI>

# =============================================
# Configuración de Spring Boot Actuator
# =============================================
management.endpoints.web.exposure.include=*
management.metrics.export.prometheus.enabled=true

# =============================================
# Configuración de Swagger/OpenAPI
# =============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# =============================================
# Configuración de Jackson
# =============================================
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

