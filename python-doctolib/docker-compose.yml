version: '3.8'

services:
  api:
    build: .
    container_name: doctolib-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql://doctolib:doctolib@mysql:3306/doctolib
      - SECRET_KEY=your-secret-key-here
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      - mysql
    volumes:
      - .:/app

  mysql:
    image: mysql:8.0
    container_name: doctolib-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctolib
      MYSQL_USER: doctolib
      MYSQL_PASSWORD: doctolib
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: 